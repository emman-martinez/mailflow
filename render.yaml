services:
  - type: keyvalue
    name: mailflow-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: mailflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    dockerCommand: >-
      sh -c "npx prisma migrate deploy --config apps/api/prisma.config.ts &&
      node apps/api/dist/server.js"

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: LOG_LEVEL
        value: info

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: mailflow-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mailflow-redis
          property: connectionString

      - key: WEB_ORIGIN
        fromService:
          type: web
          name: mailflow-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: mailflow-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .

    envVars:
      - key: NODE_ENV
        value: production

      - key: LOG_LEVEL
        value: info

      - key: DATABASE_URL
        fromDatabase:
          name: mailflow-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mailflow-redis
          property: connectionString

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: MAIL_FROM
        sync: false

  - type: web
    name: mailflow-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build -w @mailflow/web
    staticPublishPath: ./apps/web/dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mailflow-api
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mailflow-db
    plan: free
    postgresMajorVersion: "17"
